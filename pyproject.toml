[project]
name = "pyvartoolbox"
version = "0.4.0"
description = "VAR and local-projection analysis in Python — a port of the MATLAB VAR Toolbox"
authors = [
    {name = "Ruben Fernandez-Fuertes", email = "fernandezfuertesruben@gmail.com"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["var", "svar", "econometrics", "impulse-response", "local-projections", "macroeconomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/r-uben/pyvartoolbox"
Repository = "https://github.com/r-uben/pyvartoolbox"
Issues = "https://github.com/r-uben/pyvartoolbox/issues"
Upstream = "https://github.com/ambropo/VAR-Toolbox"

[project.optional-dependencies]
# The JAX backend accelerates the resampling layers (bootstrap replications,
# sign-restriction rejection sampling). It is optional by design: the numpy path
# stays the reference implementation.
jax = [
    "jax>=0.4.30",
]
plot = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyvartoolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
