[project]
name = "pyvartoolbox-docs"
version = "0.5.0"
description = "Repository documentation tooling for pyvartoolbox — not published, not part of the library"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pyvartoolbox-convert-handbook = "pyvartoolbox_docs._convert:main"
pyvartoolbox-graph-diagram = "pyvartoolbox_docs._graph:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyvartoolbox_docs"]
